- version: 0.13.0
  type: stable
  unix-timestamp: 1792057429
  description:
    C: >-
      <ul><li>Optional: unlock only with face and ✌, so nobody gets in by holding the computer up to your face.</li><li>Add
      to your face: named additions such as glasses or different light, up to three, each can be deleted. Only images that
