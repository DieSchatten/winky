ProjectLicense: MIT AND Apache-2.0
Name:
  C: Winky
Summary:
  C: Unlock your screen with your face, like Windows Hello
  de: Den Sperrbildschirm mit dem Gesicht öffnen, wie Windows Hello
Description:
  C: >-
    <p>Winky unlocks the GNOME lock screen with a glance at the camera, similar to Windows Hello. It uses the laptop's infrared
    camera; photos on a phone or screen are invisible in the infrared image.</p>

    <ul><li>A setup assistant guides you through everything in a few minutes, no terminal needed.</li><li>Your password always
    works. After switching on the computer, for su, remote access and administrator dialogs it is required anyway.</li><li>Optional:
    confirm sudo in the terminal with your face and the ✌ sign instead of your password. A large ✌ notice shows the command.</li><li>Optional:
    unlock KeePassXC (from version 2.8) with your face and ✌.</li><li>Optional: approve administrator dialogs such as installing
    updates with your face and ✌ instead of the password.</li><li>Optional: unlock only with face and ✌, so nobody gets in
    by holding the computer up to your face.</li><li>Optional: infrared camera only for Winky, so other programs can no longer
    switch it on.</li><li>A history shows afterwards what was unlocked and approved, including every sudo command, handy when
    an AI assistant or a script uses sudo for you.</li><li>No images are stored, only face features that only the system can
    read. No network access.</li><li>Everyone records their own face with their own password.</li></ul>

    <p>Winky is a convenience for the lock screen, not theft protection and no liveness detection: a printout visible in infrared
    or very similar siblings can fool it. When uninstalled, only the password applies again, and the face data of all users
    is deleted.</p>

    <p>Requires an infrared camera (Windows Hello camera) and GNOME with GDM, for example Zorin OS 18 or Ubuntu 24.04. So
    far tested on two laptops, including a Microsoft Surface Laptop 4; other cameras may behave differently. Use at your own
    risk.</p>
  de: >-
    <p>Winky öffnet die GNOME-Bildschirmsperre mit einem Blick in die Kamera, ähnlich wie Windows Hello. Dafür nutzt Winky
    die Infrarot-Kamera des Laptops; Fotos auf Handy oder Bildschirm sind im Infrarot-Bild unsichtbar.</p>

    <ul><li>Ein Assistent führt in wenigen Minuten durch die Einrichtung, ganz ohne Terminal.</li><li>Das Passwort geht immer.
    Nach dem Einschalten des Rechners, für su, Fernzugriff und Administrator-Dialoge bleibt es ohnehin nötig.</li><li>Wahlweise
    bestätigt man sudo im Terminal mit Gesicht und dem Handzeichen ✌ statt mit dem Passwort. Ein großer ✌-Hinweis zeigt den
    Befehl.</li><li>Wahlweise KeePassXC (ab Version 2.8) mit Gesicht und ✌ entsperren.</li><li>Wahlweise Administrator-Dialoge
    wie das Installieren von Updates mit Gesicht und ✌ statt Passwort freigeben.</li><li>Wahlweise nur mit Gesicht und ✌ entsperren,
    damit niemand hineinkommt, der dir den Rechner vors Gesicht hält.</li><li>Wahlweise Infrarot-Kamera nur für Winky, damit
    andere Programme sie nicht mehr einschalten können.</li><li>Ein Verlauf zeigt im Nachhinein, was entsperrt und freigegeben
    wurde, samt jedem sudo-Befehl, praktisch, wenn ein KI-Assistent oder ein Skript für dich sudo nutzt.</li><li>Gespeichert
    werden keine Bilder, nur Gesichtsmerkmale, die nur das System lesen kann. Kein Netzwerkzugriff.</li><li>Jede Person nimmt
    ihr eigenes Gesicht mit ihrem eigenen Passwort auf.</li></ul>

    <p>Winky ist ein Komfort für die Bildschirmsperre, kein Diebstahlschutz und keine Lebenderkennung: Ein im Infrarot sichtbarer
    Ausdruck oder sehr ähnliche Geschwister können täuschen. Beim Deinstallieren gilt sofort wieder nur das Passwort, und
    die Gesichtsdaten aller Benutzer werden gelöscht.</p>

    <p>Braucht eine Infrarot-Kamera (Windows-Hello-Kamera) und GNOME mit GDM, zum Beispiel Zorin OS 18 oder Ubuntu 24.04.
    Bisher an zwei Laptops getestet, darunter ein Microsoft Surface Laptop 4; andere Kameras können sich anders verhalten.
    Die Nutzung erfolgt auf eigenes Risiko.</p>
