- version: 0.12.0
  type: stable
  unix-timestamp: 1791845008
  description:
    C: >-
      <ul><li>Calmer app with a sidebar: overview, unlocks, face, history, security and advanced settings each on their own
      page.</li><li>Every risky option explains its risk with an info button, and login after startup asks again before it
      is turned on.</li><li>Round camera view with a progress ring.</li><li>The history shows every sudo command and approved
      administrator dialog afterwards.</li></ul>
- version: 0.11.1
  type: stable
  unix-timestamp: 1791746777
  description:
    C: >-
      <ul><li>The keyring dialog no longer opens twice; tested on two laptops, including a Microsoft Surface Laptop 4.</li></ul>
- version: 0.11.0
  type: stable
  unix-timestamp: 1791668322
  description:
    C: >-
      <ul><li>Optional: log in after startup with your face. The login keyring then stays locked.</li><li>Experimental: also
      unlock the login keyring after a face login (password sealed in the TPM chip).</li><li>Administrator dialogs now work
      inside the password dialog itself: one switch, and background permission checks never turn on the camera.</li><li>Status
      messages at the login screen.</li><li>Adjustable time for the ✌; the ✌ window shows what you are approving.</li><li>“About
      Winky” with version, license and project page.</li></ul>
- version: 0.10.0
